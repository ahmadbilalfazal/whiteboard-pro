version: '3.8'
services:
  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/whiteboard
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
  client:
    build: ./client
    ports:
      - "5173:5173"
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  redis:
    image: redis:6
    ports:
      - "6379:6379"
volumes:
  mongo-data:
